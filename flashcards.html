<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judo 5.5 KYU – Fiszki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 { font-size: 1.6rem; margin-bottom: 6px; color: #e94560; letter-spacing: 1px; }

    /* ── MODE SWITCHER ── */
    .mode-switch {
      display: flex;
      gap: 0;
      border: 2px solid #e94560;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .mode-btn {
      padding: 9px 18px;
      border: none;
      background: transparent;
      color: #e94560;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: all .2s;
    }

    .mode-btn.active { background: #e94560; color: #fff; }

    /* ── CATEGORY FILTER ── */
    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .cat-btn {
      padding: 6px 14px;
      border: 2px solid #e94560;
      border-radius: 20px;
      background: transparent;
      color: #e94560;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all .2s;
    }

    .cat-btn.active, .cat-btn:hover { background: #e94560; color: #fff; }

    /* ── PROGRESS ── */
    .progress-bar-wrap {
      width: 100%;
      max-width: 520px;
      background: #16213e;
      border-radius: 10px;
      height: 8px;
      margin-bottom: 10px;
    }

    .progress-bar { height: 8px; border-radius: 10px; background: #e94560; transition: width .4s; }
    .progress-text { font-size: 0.8rem; color: #aaa; margin-bottom: 18px; }

    /* ── FLASHCARD ── */
    .card-container {
      width: 100%;
      max-width: 520px;
      height: 260px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .5s ease;
    }

    .card-container.flipped .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }

    .card-front { background: linear-gradient(135deg, #16213e 0%, #0f3460 100%); border: 2px solid #e94560; }
    .card-back  { background: linear-gradient(135deg, #0f3460 0%, #16213e 100%); border: 2px solid #57cc99; transform: rotateY(180deg); }

    .card-category { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #e94560; margin-bottom: 12px; }
    .card-back .card-category { color: #57cc99; }
    .card-term       { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .card-hint       { font-size: 0.75rem; color: #888; margin-top: 16px; }
    .card-definition { font-size: 1.1rem; color: #e0e0e0; line-height: 1.5; }

    /* reversed badge */
    .reverse-badge {
      display: inline-block;
      font-size: 0.7rem;
      background: #ffd166;
      color: #1a1a2e;
      border-radius: 8px;
      padding: 2px 8px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .nav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }

    .nav-btn {
      padding: 10px 22px;
      border-radius: 12px;
      background: #16213e;
      color: #eee;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background .2s;
      border: 2px solid #e94560;
    }

    .nav-btn:hover { background: #e94560; }

    .icon-btn {
      padding: 8px 14px;
      border-radius: 12px;
      background: transparent;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all .2s;
    }

    .shuffle-btn { border: 2px solid #57cc99; color: #57cc99; }
    .shuffle-btn:hover { background: #57cc99; color: #1a1a2e; }

    .reverse-btn { border: 2px solid #ffd166; color: #ffd166; }
    .reverse-btn:hover, .reverse-btn.active { background: #ffd166; color: #1a1a2e; }

    .stats { margin-top: 20px; display: flex; gap: 20px; }

    .stat-btn { padding: 8px 18px; border-radius: 10px; font-size: 0.8rem; cursor: pointer; border: none; transition: opacity .2s; }
    .stat-btn:hover { opacity: .85; }
    .btn-known   { background: #57cc99; color: #1a1a2e; }
    .btn-unknown { background: #e94560; color: #fff; }

    .known-count, .unknown-count { font-size: 0.75rem; color: #aaa; text-align: center; margin-top: 4px; }
    .stat-group { display: flex; flex-direction: column; align-items: center; }

    .summary { display: none; flex-direction: column; align-items: center; gap: 14px; margin-top: 20px; }
    .summary h2 { color: #57cc99; font-size: 1.4rem; }
    .summary p  { color: #ccc; }

    .restart-btn { padding: 10px 28px; background: #e94560; border: none; border-radius: 12px; color: #fff; font-size: 1rem; cursor: pointer; }

    /* ── MATCH GAME ── */
    #matchSection { width: 100%; max-width: 560px; display: none; flex-direction: column; align-items: center; }

    .match-header { font-size: 1rem; color: #aaa; margin-bottom: 6px; }

    .match-score-bar { display: flex; gap: 8px; margin-bottom: 18px; align-items: center; }

    .heart { font-size: 1.4rem; transition: transform .2s; }
    .heart.lost { filter: grayscale(1) opacity(.4); }

    .match-round { font-size: 0.8rem; color: #aaa; margin-left: auto; }

    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 20px; }

    .match-tile {
      background: #16213e;
      border: 3px solid #0f3460;
      border-radius: 16px;
      padding: 16px 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #eee;
      cursor: pointer;
      text-align: center;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      transition: border-color .15s, background .15s, transform .1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .match-tile:active { transform: scale(.96); }
    .match-tile.term-tile { border-color: #e94560; }
    .match-tile.def-tile  { border-color: #3a7bd5; }
    .match-tile.selected  { background: #2a2a5e; border-color: #ffd166 !important; color: #ffd166; transform: scale(1.03); }
    .match-tile.correct   { background: #1a4a2e; border-color: #57cc99 !important; color: #57cc99; pointer-events: none; animation: popIn .3s ease; }
    .match-tile.wrong     { animation: shake .4s ease; border-color: #e94560 !important; }
    .match-tile.gone      { visibility: hidden; pointer-events: none; }

    /* ── QUIZ ── */
    #quizSection { width: 100%; max-width: 520px; display: none; flex-direction: column; align-items: center; }

    .quiz-topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .quiz-score { color: #57cc99; font-weight: 700; font-size: 1rem; }

    .quiz-question-box {
      width: 100%;
      background: linear-gradient(135deg, #16213e, #0f3460);
      border: 2px solid #e94560;
      border-radius: 18px;
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 18px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
    }

    .quiz-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #e94560; }
    .quiz-question { font-size: 1.35rem; font-weight: 700; color: #fff; line-height: 1.4; }

    .quiz-options {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .quiz-opt {
      background: #16213e;
      border: 2px solid #3a7bd5;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 0.95rem;
      color: #eee;
      cursor: pointer;
      text-align: center;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
      transition: all .15s;
      user-select: none;
      font-weight: 500;
    }

    .quiz-opt:hover:not(:disabled) { border-color: #ffd166; color: #ffd166; }
    .quiz-opt.correct { background: #1a4a2e; border-color: #57cc99; color: #57cc99; animation: popIn .3s ease; }
    .quiz-opt.wrong   { background: #3a1a1a; border-color: #e94560; color: #e94560; animation: shake .4s ease; }
    .quiz-opt:disabled { cursor: default; opacity: .7; }

    .quiz-reverse-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .quiz-end {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 28px;
      background: #16213e;
      border: 3px solid #57cc99;
      border-radius: 24px;
      width: 100%;
      text-align: center;
    }

    .quiz-end.show { display: flex; }
    .quiz-end .big-emoji { font-size: 3rem; animation: bounce .5s ease infinite alternate; }
    .quiz-end h2 { color: #57cc99; }
    .quiz-end p  { color: #ccc; }

    /* ── SHARED ── */
    .celebration {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 28px;
      background: #16213e;
      border: 3px solid #57cc99;
      border-radius: 24px;
      width: 100%;
      text-align: center;
    }

    .celebration.show { display: flex; }
    .celebration .big-emoji { font-size: 3.5rem; animation: bounce .5s ease infinite alternate; }
    .celebration h2 { color: #57cc99; font-size: 1.5rem; }
    .celebration p  { color: #ccc; font-size: 0.95rem; }

    .next-round-btn {
      padding: 14px 36px;
      background: #57cc99;
      border: none;
      border-radius: 14px;
      color: #1a1a2e;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .2s;
    }

    .next-round-btn:hover { opacity: .88; }

    @keyframes popIn {
      0%   { transform: scale(1.05); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      40%     { transform: translateX(8px); }
      60%     { transform: translateX(-6px); }
      80%     { transform: translateX(6px); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-10px); }
    }

    #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 999; }
  </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<h1>🥋 Judo 5.5 KYU</h1>

<!-- MODE SWITCHER -->
<div class="mode-switch">
  <button class="mode-btn active" id="btnFlash" onclick="switchMode('flash')">📖 Fiszki</button>
  <button class="mode-btn"        id="btnMatch" onclick="switchMode('match')">🔗 Dopasuj</button>
  <button class="mode-btn"        id="btnQuiz"  onclick="switchMode('quiz')">🧠 Quiz</button>
</div>

<!-- ══════════ FLASHCARD SECTION ══════════ -->
<div id="flashSection">
  <p style="font-size:.85rem;color:#aaa;margin-bottom:12px;text-align:center">Kliknij kartę aby odkryć definicję</p>

  <div class="categories" id="categories"></div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-text" id="progressText"></div>

  <div class="card-container" id="card" onclick="flipCard()">
    <div class="card-inner">
      <div class="card-face card-front">
        <div class="card-category" id="frontCategory"></div>
        <div id="frontBadge"></div>
        <div class="card-term" id="frontTerm"></div>
        <div class="card-hint" id="cardHint">dotknij aby zobaczyć definicję</div>
      </div>
      <div class="card-face card-back">
        <div class="card-category" id="backCategory"></div>
        <div class="card-definition" id="backDef"></div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button class="nav-btn" onclick="prevCard()">&#8592;</button>
    <button class="icon-btn shuffle-btn" onclick="shuffle()">&#x21C4; Losuj</button>
    <button class="icon-btn reverse-btn" id="reverseBtn" onclick="toggleReverse()">🔄 Odwróć</button>
    <button class="nav-btn" onclick="nextCard()">&#8594;</button>
  </div>

  <div class="stats">
    <div class="stat-group">
      <button class="stat-btn btn-known" onclick="markKnown()">&#10003; Znam</button>
      <div class="known-count" id="knownCount">Znam: 0</div>
    </div>
    <div class="stat-group">
      <button class="stat-btn btn-unknown" onclick="markUnknown()">&#10007; Uczę się</button>
      <div class="unknown-count" id="unknownCount">Uczę się: 0</div>
    </div>
  </div>

  <div class="summary" id="summary">
    <h2>Koniec talii!</h2>
    <p id="summaryText"></p>
    <button class="restart-btn" onclick="restart()">&#x21BA; Zacznij od nowa</button>
  </div>
</div>

<!-- ══════════ MATCH SECTION ══════════ -->
<div id="matchSection">
  <div class="match-header">Połącz słowo z jego znaczeniem!</div>
  <div class="match-score-bar">
    <span class="heart" id="h1">❤️</span>
    <span class="heart" id="h2">❤️</span>
    <span class="heart" id="h3">❤️</span>
    <span class="match-round" id="matchRound"></span>
  </div>
  <div class="match-grid" id="matchGrid"></div>
  <div class="celebration" id="celebration">
    <div class="big-emoji" id="celebEmoji">🎉</div>
    <h2 id="celebTitle">Świetnie!</h2>
    <p id="celebMsg"></p>
    <button class="next-round-btn" id="nextRoundBtn" onclick="nextRound()">Dalej →</button>
  </div>
</div>

<!-- ══════════ QUIZ SECTION ══════════ -->
<div id="quizSection">
  <div class="quiz-topbar">
    <span id="quizProgress">Pytanie 1 z 34</span>
    <span class="quiz-score" id="quizScore">✓ 0 &nbsp; ✗ 0</span>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="quizBar"></div>
  </div>

  <div style="height:10px"></div>

  <div class="quiz-reverse-row">
    <button class="icon-btn reverse-btn" id="quizReverseBtn" onclick="toggleQuizReverse()">🔄 Odwróć pytania</button>
  </div>

  <div class="quiz-question-box">
    <div class="quiz-label" id="quizLabel">Podaj znaczenie:</div>
    <div class="quiz-question" id="quizQuestion"></div>
  </div>

  <div class="quiz-options" id="quizOptions"></div>

  <div class="quiz-end" id="quizEnd">
    <div class="big-emoji" id="quizEndEmoji">🎉</div>
    <h2 id="quizEndTitle">Koniec quizu!</h2>
    <p id="quizEndMsg"></p>
    <button class="next-round-btn" onclick="startQuiz()">&#x21BA; Jeszcze raz!</button>
  </div>
</div>

<script>
/* ════════════════════════════════════════
   DATA
════════════════════════════════════════ */
const ALL_CARDS = [
  { cat: "Historia",     term: "Judo",              def: "Japońska sztuka walki wręcz (BUDO); pierwsza olimpijska dyscyplina walki; twórcą jest prof. Jigoro Kano." },
  { cat: "Historia",     term: "Jigoro Kano",        def: "Twórca judo (1860–1938). Zebrał, usystematyzował i ulepszył chwyty starego ju-jitsu, usunął elementy zagrażające zdrowiu." },
  { cat: "Historia",     term: "Kodokan",             def: "Pierwsza szkoła judo założona przez Kano w Tokio w 1882 r. – rok uznany za początek istnienia judo." },
  { cat: "Historia",     term: "JU",                  def: "Łagodność, ustępliwość, zwinność." },
  { cat: "Historia",     term: "DO",                  def: "Droga, zasada, sposób." },
  { cat: "Zasady judo",  term: "Zasada 1 – Ju",       def: "Ustąp, aby zwyciężyć. Wykorzystuj siłę przeciwnika zamiast jej się przeciwstawiać." },
  { cat: "Zasady judo",  term: "Seiryoku zenyo",       def: "Zasada 2: osiągnięcie maksimum efektu przy minimalnym wysiłku fizycznym i psychicznym." },
  { cat: "Zasady judo",  term: "Jita kyoei",           def: "Zasada 3: trenowanie dla wzajemnego dobra i korzyści." },
  { cat: "Pojęcia",      term: "Judoga",               def: "Strój do judo." },
  { cat: "Pojęcia",      term: "Judoka",               def: "Zawodnik trenujący judo." },
  { cat: "Pojęcia",      term: "Keikogi",              def: "Bluza judogi." },
  { cat: "Pojęcia",      term: "Zubon",                def: "Spodnie judogi." },
  { cat: "Pojęcia",      term: "Obi",                  def: "Pas od judogi." },
  { cat: "Pojęcia",      term: "Tachi Waza",           def: "Technika w stójce." },
  { cat: "Pojęcia",      term: "Ne Waza",              def: "Technika w parterze." },
  { cat: "Pojęcia",      term: "Randori",              def: "Walka szkoleniowa (sparring)." },
  { cat: "Terminologia", term: "Rei",                  def: "Ukłon." },
  { cat: "Terminologia", term: "Tori",                 def: "Atakujący, wykonujący ćwiczenia." },
  { cat: "Terminologia", term: "Uke",                  def: "Broniący się – ten, na którym Tori wykonuje daną technikę." },
  { cat: "Terminologia", term: "Kumi Kata",            def: "Uchwyt klasyczny." },
  { cat: "Terminologia", term: "Maita",                def: "Poddaję się." },
  { cat: "Terminologia", term: "Shisen Hontai",        def: "Postawa neutralna (klasyczna)." },
  { cat: "Terminologia", term: "Jigotai",              def: "Postawa obronna." },
  { cat: "Terminologia", term: "Migi",                 def: "Prawa strona." },
  { cat: "Terminologia", term: "Hidari",               def: "Lewa strona." },
  { cat: "Fazy rzutu",   term: "Kuzushi",              def: "1. faza rzutu – wychylenie (wyprowadzenie z równowagi)." },
  { cat: "Fazy rzutu",   term: "Tsukuri",              def: "2. faza rzutu – wejście (ustawienie się do techniki)." },
  { cat: "Fazy rzutu",   term: "Kake",                 def: "3. faza rzutu – rzut (wykonanie techniki)." },
  { cat: "Sędziowanie",  term: "Yuko",                 def: "Najniższy punkt w walce (najniższa ocena rzutu)." },
  { cat: "Sędziowanie",  term: "Wazari",               def: "Średni punkt w walce." },
  { cat: "Sędziowanie",  term: "Ippon",                def: "Najwyższy punkt – kończy walkę." },
  { cat: "Sędziowanie",  term: "Shido",                def: "Kara w walce. Trzy shido = hansokumake." },
  { cat: "Sędziowanie",  term: "Hansokumake",          def: "Dyskwalifikacja (3 × shido)." },
  { cat: "Sędziowanie",  term: "Sonomama",             def: "Bezruch – zatrzymanie walki." },
];

/* ════════════════════════════════════════
   FLASHCARD
════════════════════════════════════════ */
let deck = [], current = 0, known = 0, unknown = 0;
let activeCategories = new Set(["Wszystkie"]);
let reversed = false;

function allCats() { return ["Wszystkie", ...new Set(ALL_CARDS.map(c => c.cat))]; }

function buildDeck() {
  deck = activeCategories.has("Wszystkie")
    ? [...ALL_CARDS]
    : ALL_CARDS.filter(c => activeCategories.has(c.cat));
  current = 0; known = 0; unknown = 0;
  updateStats();
}

function renderCategories() {
  const wrap = document.getElementById("categories");
  wrap.innerHTML = "";
  allCats().forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (activeCategories.has(cat) ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => toggleCat(cat);
    wrap.appendChild(btn);
  });
}

function toggleCat(cat) {
  if (cat === "Wszystkie") {
    activeCategories = new Set(["Wszystkie"]);
  } else {
    activeCategories.delete("Wszystkie");
    activeCategories.has(cat) ? activeCategories.delete(cat) : activeCategories.add(cat);
    if (!activeCategories.size) activeCategories.add("Wszystkie");
  }
  renderCategories();
  buildDeck();
  showCard();
  hideSummary();
}

function showCard() {
  document.getElementById("card").classList.remove("flipped");
  if (!deck.length || current >= deck.length) { showSummary(); return; }
  const c = deck[current];

  const front  = reversed ? c.def  : c.term;
  const back   = reversed ? c.term : c.def;
  const isLong = reversed; // definition on front → smaller font handled via class

  document.getElementById("frontCategory").textContent = c.cat;
  document.getElementById("backCategory").textContent  = c.cat;

  const frontTermEl = document.getElementById("frontTerm");
  frontTermEl.textContent = front;
  frontTermEl.style.fontSize = reversed ? "1rem" : "2rem";

  document.getElementById("backDef").textContent = back;
  document.getElementById("cardHint").textContent = reversed
    ? "dotknij aby zobaczyć japońską nazwę"
    : "dotknij aby zobaczyć definicję";

  const badge = document.getElementById("frontBadge");
  badge.innerHTML = reversed
    ? '<span class="reverse-badge">🔄 odwrócone</span>'
    : "";

  document.getElementById("progressBar").style.width = (current / deck.length * 100) + "%";
  document.getElementById("progressText").textContent = `Karta ${current + 1} z ${deck.length}`;
}

function toggleReverse() {
  reversed = !reversed;
  document.getElementById("reverseBtn").classList.toggle("active", reversed);
  showCard();
  hideSummary();
}

function flipCard()  { document.getElementById("card").classList.toggle("flipped"); }
function nextCard()  { if (current < deck.length - 1) { current++; showCard(); } else showSummary(); }
function prevCard()  { if (current > 0) { current--; showCard(); } }

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  current = 0; known = 0; unknown = 0;
  updateStats(); showCard(); hideSummary();
}

function markKnown()   { known++;   updateStats(); nextCard(); }
function markUnknown() { unknown++; updateStats(); nextCard(); }

function updateStats() {
  document.getElementById("knownCount").textContent   = `Znam: ${known}`;
  document.getElementById("unknownCount").textContent = `Uczę się: ${unknown}`;
}

function showSummary() {
  document.getElementById("summary").style.display = "flex";
  document.getElementById("progressBar").style.width = "100%";
  document.getElementById("progressText").textContent = `Koniec! Kart: ${deck.length}`;
  const total = known + unknown;
  document.getElementById("summaryText").textContent = total > 0
    ? `Znasz ${known} z ${total} kart (${Math.round(known / total * 100)}%).`
    : `Przejrzano ${deck.length} kart.`;
}

function hideSummary() { document.getElementById("summary").style.display = "none"; }
function restart() { buildDeck(); showCard(); hideSummary(); }

/* ════════════════════════════════════════
   MATCH GAME
════════════════════════════════════════ */
const ROUND_SIZE = 5;
let matchPool = [], matchOffset = 0, lives = 3, matchScore = 0, totalPairs = 0;
let selectedTerm = null, selectedDef = null, matched = 0, busy = false;

function startMatch() {
  matchPool = [...ALL_CARDS].sort(() => Math.random() - .5);
  matchOffset = 0; lives = 3; matchScore = 0; totalPairs = matchPool.length;
  updateHearts();
  loadRound();
}

function loadRound() {
  selectedTerm = null; selectedDef = null; matched = 0; busy = false;
  document.getElementById("celebration").classList.remove("show");
  const slice = matchPool.slice(matchOffset, matchOffset + ROUND_SIZE);
  if (!slice.length) { showMatchWin(); return; }
  document.getElementById("matchRound").textContent = `${matchOffset + slice.length} / ${totalPairs} par`;
  renderMatchGrid(slice);
}

function renderMatchGrid(slice) {
  const grid = document.getElementById("matchGrid");
  grid.innerHTML = "";
  const terms = slice.map((c, i) => ({ text: c.term, id: i, type: "term" })).sort(() => Math.random() - .5);
  const defs  = slice.map((c, i) => ({ text: c.def,  id: i, type: "def"  })).sort(() => Math.random() - .5);
  for (let r = 0; r < slice.length; r++) {
    makeTile(grid, terms[r], "term-tile");
    makeTile(grid, defs[r],  "def-tile");
  }
}

function makeTile(grid, item, cls) {
  const el = document.createElement("div");
  el.className = "match-tile " + cls;
  el.textContent = item.text;
  el.onclick = () => onTileClick(el, item);
  grid.appendChild(el);
}

function onTileClick(el, item) {
  if (busy || el.classList.contains("correct") || el.classList.contains("gone")) return;
  if (item.type === "term") {
    if (selectedTerm) selectedTerm.el.classList.remove("selected");
    if (selectedTerm?.el === el) { selectedTerm = null; return; }
    selectedTerm = { el, id: item.id };
    el.classList.add("selected");
  } else {
    if (selectedDef) selectedDef.el.classList.remove("selected");
    if (selectedDef?.el === el) { selectedDef = null; return; }
    selectedDef = { el, id: item.id };
    el.classList.add("selected");
  }
  if (selectedTerm && selectedDef) checkMatch();
}

function checkMatch() {
  const tEl = selectedTerm.el, dEl = selectedDef.el;
  const tId = selectedTerm.id, dId = selectedDef.id;
  busy = true;

  if (tId === dId) {
    tEl.classList.remove("selected"); dEl.classList.remove("selected");
    tEl.classList.add("correct");     dEl.classList.add("correct");
    matchScore++; matched++;
    setTimeout(() => {
      tEl.classList.add("gone"); dEl.classList.add("gone");
      selectedTerm = null; selectedDef = null; busy = false;
      const sliceLen = Math.min(ROUND_SIZE, matchPool.length - matchOffset);
      if (matched >= sliceLen) { matchOffset += ROUND_SIZE; setTimeout(showRoundCelebration, 250); }
    }, 500);
  } else {
    tEl.classList.add("wrong"); dEl.classList.add("wrong");
    loseLife();
    setTimeout(() => {
      tEl.classList.remove("wrong", "selected");
      dEl.classList.remove("wrong", "selected");
      selectedTerm = null; selectedDef = null; busy = false;
    }, 600);
  }
}

function loseLife() {
  if (lives > 0) lives--;
  updateHearts();
  if (lives === 0) setTimeout(showMatchLose, 700);
}

function updateHearts() {
  ["h1","h2","h3"].forEach((id, i) => {
    document.getElementById(id).classList.toggle("lost", i >= lives);
  });
}

const CELEBRATE = [
  { emoji: "🎉", title: "Super!",       msg: "Doskonale! Idziesz jak burza!" },
  { emoji: "⭐", title: "Brawo!",       msg: "Świetna robota, judoka!" },
  { emoji: "🏆", title: "Rewelacja!",   msg: "Jesteś mistrzem fiszek!" },
  { emoji: "🥋", title: "OSU!",         msg: "Kolejna runda pokonana!" },
  { emoji: "🌟", title: "Niesamowite!", msg: "Tak trzymaj, sensei!" },
];

function showRoundCelebration() {
  const c = CELEBRATE[Math.floor(Math.random() * CELEBRATE.length)];
  document.getElementById("celebEmoji").textContent = c.emoji;
  document.getElementById("celebTitle").textContent = c.title;
  const rem = matchPool.length - matchOffset;
  document.getElementById("celebMsg").textContent = rem > 0
    ? `${c.msg} Zostało jeszcze ${rem} par.`
    : `${c.msg} Skończyłeś wszystkie pary! 🎊`;
  const btn = document.getElementById("nextRoundBtn");
  btn.textContent = rem > 0 ? "Dalej →" : "Zagraj jeszcze raz!";
  btn.onclick = rem > 0 ? nextRound : startMatch;
  document.getElementById("celebration").classList.add("show");
  launchConfetti();
}

function showMatchWin() {
  document.getElementById("celebEmoji").textContent = "🥇";
  document.getElementById("celebTitle").textContent = "Ukończyłeś wszystko!";
  document.getElementById("celebMsg").textContent = `Połączyłeś wszystkie ${totalPairs} pary! Jesteś mistrzem judo!`;
  const btn = document.getElementById("nextRoundBtn");
  btn.textContent = "Zagraj jeszcze raz!"; btn.onclick = startMatch;
  document.getElementById("celebration").classList.add("show");
  launchConfetti();
}

function showMatchLose() {
  document.getElementById("celebEmoji").textContent = "💪";
  document.getElementById("celebTitle").textContent = "Próbuj dalej!";
  document.getElementById("celebMsg").textContent = "Straciłeś wszystkie serca. Spróbuj jeszcze raz!";
  const btn = document.getElementById("nextRoundBtn");
  btn.textContent = "Spróbuj jeszcze raz!"; btn.onclick = startMatch;
  document.getElementById("celebration").classList.add("show");
}

function nextRound() { loadRound(); }

/* ════════════════════════════════════════
   QUIZ
════════════════════════════════════════ */
let quizDeck = [], quizIdx = 0, quizCorrect = 0, quizWrong = 0;
let quizReversed = false;

function toggleQuizReverse() {
  quizReversed = !quizReversed;
  document.getElementById("quizReverseBtn").classList.toggle("active", quizReversed);
  startQuiz();
}

function startQuiz() {
  quizDeck = [...ALL_CARDS].sort(() => Math.random() - .5);
  quizIdx = 0; quizCorrect = 0; quizWrong = 0;
  document.getElementById("quizEnd").classList.remove("show");
  showQuizQuestion();
}

function showQuizQuestion() {
  if (quizIdx >= quizDeck.length) { endQuiz(); return; }

  const c = quizDeck[quizIdx];
  const total = quizDeck.length;

  document.getElementById("quizProgress").textContent = `Pytanie ${quizIdx + 1} z ${total}`;
  document.getElementById("quizScore").textContent = `✓ ${quizCorrect}  ✗ ${quizWrong}`;
  document.getElementById("quizBar").style.width = (quizIdx / total * 100) + "%";

  if (quizReversed) {
    document.getElementById("quizLabel").textContent = "Jaka to japońska nazwa?";
    document.getElementById("quizQuestion").textContent = c.def;
  } else {
    document.getElementById("quizLabel").textContent = "Co znaczy:";
    document.getElementById("quizQuestion").textContent = c.term;
  }

  // build 4 options: 1 correct + 3 random wrong
  const others = ALL_CARDS.filter(x => x !== c).sort(() => Math.random() - .5).slice(0, 3);
  const opts = [c, ...others].sort(() => Math.random() - .5);

  const container = document.getElementById("quizOptions");
  container.innerHTML = "";
  opts.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "quiz-opt";
    btn.textContent = quizReversed ? opt.term : opt.def;
    btn.onclick = () => onQuizAnswer(btn, opt === c, quizReversed ? c.term : c.def, container);
    container.appendChild(btn);
  });
}

function onQuizAnswer(btn, isCorrect, correctText, container) {
  // disable all
  container.querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);

  if (isCorrect) {
    btn.classList.add("correct");
    quizCorrect++;
    setTimeout(() => { quizIdx++; showQuizQuestion(); }, 900);
  } else {
    btn.classList.add("wrong");
    quizWrong++;
    // highlight correct
    container.querySelectorAll(".quiz-opt").forEach(b => {
      if (b.textContent === correctText) b.classList.add("correct");
    });
    setTimeout(() => { quizIdx++; showQuizQuestion(); }, 1400);
  }
}

function endQuiz() {
  const total = quizCorrect + quizWrong;
  const pct   = Math.round(quizCorrect / total * 100);
  document.getElementById("quizBar").style.width = "100%";
  document.getElementById("quizProgress").textContent = `Koniec!`;
  document.getElementById("quizScore").textContent = `✓ ${quizCorrect}  ✗ ${quizWrong}`;

  const emoji = pct >= 80 ? "🥇" : pct >= 50 ? "🎉" : "💪";
  const title = pct >= 80 ? "Doskonale!" : pct >= 50 ? "Nieźle!" : "Ćwicz dalej!";
  document.getElementById("quizEndEmoji").textContent = emoji;
  document.getElementById("quizEndTitle").textContent = title;
  document.getElementById("quizEndMsg").textContent =
    `Odpowiedziałeś poprawnie na ${quizCorrect} z ${total} pytań (${pct}%).`;
  document.getElementById("quizEnd").classList.add("show");
  if (pct >= 80) launchConfetti();
}

/* ════════════════════════════════════════
   CONFETTI
════════════════════════════════════════ */
function launchConfetti() {
  const canvas = document.getElementById("confettiCanvas");
  const ctx    = canvas.getContext("2d");
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const pieces = Array.from({ length: 80 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    r: 6 + Math.random() * 8,
    color: ["#e94560","#57cc99","#ffd166","#3a7bd5","#ff9ff3"][Math.floor(Math.random() * 5)],
    tilt: Math.random() * 10 - 10,
    speed: 2 + Math.random() * 3,
  }));
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.y += p.speed; p.tilt += 0.1;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r, p.r / 2, p.tilt, 0, 2 * Math.PI);
      ctx.fillStyle = p.color; ctx.fill();
    });
    if (++frame < 90) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

/* ════════════════════════════════════════
   MODE SWITCHER
════════════════════════════════════════ */
function switchMode(mode) {
  ["flash","match","quiz"].forEach(m => {
    document.getElementById(m + "Section").style.display = "none";
    document.getElementById("btn" + m.charAt(0).toUpperCase() + m.slice(1)).classList.remove("active");
  });
  document.getElementById(mode + "Section").style.display = "flex";
  document.getElementById("btn" + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add("active");
  if (mode === "match") startMatch();
  if (mode === "quiz")  startQuiz();
}

   INIT
════════════════════════════════════════ */
buildDeck();
renderCategories();
showCard();
document.getElementById("flashSection").style.display = "flex";
document.getElementById("flashSection").style.flexDirection = "column";
document.getElementById("flashSection").style.alignItems = "center";
